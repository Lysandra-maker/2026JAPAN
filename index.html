<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 關西小旅｜日誌</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --mori-green: #8DA399; /* 森林綠 */
            --mori-cream: #FAF9F6; /* 米白 */
            --mori-brown: #765C48; /* 木質棕 */
            --mori-sand: #E5D3B3;  /* 柔沙色 */
            --text-color: #555555;
        }

        body {
            background-color: var(--mori-cream);
            color: var(--text-color);
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0; padding: 0 0 80px 0;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 頂部裝飾 */
        .top-banner {
            width: 100%; height: 180px;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
        }

        .header-title { font-size: 1.6rem; letter-spacing: 2px; font-weight: 400; margin: 0; }
        .weather-info { font-size: 0.9rem; margin-top: 8px; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; }

        .container { width: 90%; max-width: 500px; margin-top: -20px; }

        /* 卡片設計 */
        .card {
            background: white; border-radius: 18px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(118, 92, 72, 0.08); border: 1px solid #f0efeb;
        }

        h3 { color: var(--mori-green); font-size: 1.1rem; margin-top: 0; border-left: 4px solid var(--mori-green); padding-left: 10px; }

        /* 按鈕設計 */
        .btn {
            background-color: var(--mori-green); color: white; border: none;
            padding: 12px 20px; border-radius: 12px; width: 100%; cursor: pointer;
            font-size: 1rem; transition: 0.3s; margin-top: 10px; display: block; text-align: center; text-decoration: none;
        }
        .btn:active { transform: scale(0.98); background-color: #7a8f85; }
        .btn-outline { background: transparent; color: var(--mori-green); border: 1.5px solid var(--mori-green); }

        /* 表單元素 */
        input, select, textarea {
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--mori-sand);
            border-radius: 10px; box-sizing: border-box; color: var(--text-color); font-size: 1rem;
        }

        /* 導覽列 */
        .bottom-nav {
            position: fixed; bottom: 15px; width: 90%; max-width: 400px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; padding: 12px 0;
            border-radius: 25px; box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .nav-item { font-size: 0.8rem; color: #888; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--mori-green); font-weight: 500; }

        /* 隱藏區塊 */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div class="top-banner">
        <h1 class="header-title" id="loc-title">森之漫遊</h1>
        <div class="weather-info" id="weather-display">取得天氣中...</div>
    </div>

    <div class="container">
        <div id="page-itinerary" class="page active">
            <div class="card">
                <h3>🗓️ 行程時間軸</h3>
                <div id="itinerary-list" style="font-size: 0.95rem; line-height: 1.8;">
                    尚未新增行程。
                </div>
                <input type="text" id="plan-time" placeholder="時間 (如：09:00)">
                <textarea id="plan-desc" placeholder="行程細節 (如：預約和服體驗)"></textarea>
                <button class="btn" onclick="addPlan()">新增今日重點</button>
                <a href="https://www.google.com/maps" id="map-btn" target="_blank" class="btn btn-outline">🗺️ 打開地圖導航</a>
            </div>
        </div>

        <div id="page-finance" class="page">
            <div class="card">
                <h3>💰 記帳與分帳</h3>
                <select id="currency">
                    <option value="JPY">日圓 ¥</option>
                    <option value="TWD">台幣 $</option>
                </select>
                <input type="number" id="exp-amount" placeholder="金額">
                <input type="text" id="exp-note" placeholder="項目">
                <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
                    <span style="font-size: 0.85rem;">分攤 A:</span>
                    <input type="number" id="split-a" value="50" style="width: 70px; margin: 0;">%
                    <span style="font-size: 0.85rem;">B:</span>
                    <input type="number" id="split-b" value="50" style="width: 70px; margin: 0;">%
                </div>
                <button class="btn" onclick="saveExpense()">儲存這筆紀錄</button>
            </div>
            <div class="card">
                <h3>📊 支出統計</h3>
                <div id="expense-list" style="font-size: 0.9rem;">載入中...</div>
            </div>
        </div>

        <div id="page-files" class="page">
            <div class="card">
                <h3>📁 重要文件庫</h3>
                <p style="font-size: 0.85rem; color: #888;">包含：電子機票、訂房憑證、保險單據</p>
                <a href="https://drive.google.com/drive/folders/1i7hREjsVEpPNngJXHAGFOxzHCfvIQeMu?usp=sharing" target="_blank" class="btn">開啟 Google Drive 資料夾</a>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showPage('itinerary')">📅 行程</div>
        <div class="nav-item" onclick="showPage('finance')">💰 記帳</div>
        <div class="nav-item" onclick="showPage('files')">🏨 檔案</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyAzC3lUnUG7EyhKkcA096FywJ6A66Pnah4",
            authDomain: "japan-e9eba.firebaseapp.com",
            projectId: "japan-e9eba",
            storageBucket: "japan-e9eba.firebasestorage.app",
            messagingSenderId: "400670967338",
            appId: "1:400670967338:web:bd11f6196d1aeaeb78a553"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 介面控制 ---
        window.showPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
        };

        // --- 自動判斷地點與天氣 ---
        function initTravelLogic() {
            const today = new Date();
            const locTitle = document.getElementById('loc-title');
            const kyotoEnd = new Date('2026-06-04');
            const tripEnd = new Date('2026-06-08');

            let city = "京都";
            if (today > kyotoEnd && today <= tripEnd) city = "名古屋";
            if (today > tripEnd) city = "台灣";

            locTitle.innerText = `${city}・旅誌`;
            // 這裡模擬天氣，您以後可以串接真正的 API
            document.getElementById('weather-display').innerText = `${city} 今日 24°C / 晴時多雲`;
        }

        // --- 行程功能 ---
        window.addPlan = async function() {
            const time = document.getElementById('plan-time').value;
            const desc = document.getElementById('plan-desc').value;
            if(!time || !desc) return alert("請填寫內容");
            await addDoc(collection(db, "itinerary"), { time, desc, createdAt: serverTimestamp() });
            document.getElementById('plan-time').value = "";
            document.getElementById('plan-desc').value = "";
        };

        onSnapshot(query(collection(db, "itinerary"), orderBy("createdAt")), (snapshot) => {
            const list = document.getElementById('itinerary-list');
            list.innerHTML = snapshot.docs.map(doc => `<div><b>${doc.data().time}</b> ${doc.data().desc}</div>`).join('');
        });

        // --- 記帳功能 ---
        window.saveExpense = async function() {
            const amount = document.getElementById('exp-amount').value;
            const note = document.getElementById('exp-note').value;
            const cur = document.getElementById('currency').value;
            const a = document.getElementById('split-a').value;
            const b = document.getElementById('split-b').value;

            if(!amount || !note) return alert("請填寫金額與項目");
            await addDoc(collection(db, "expenses"), { amount, note, cur, a, b, createdAt: serverTimestamp() });
            alert("儲存成功");
        };

        onSnapshot(query(collection(db, "expenses"), orderBy("createdAt", "desc")), (snapshot) => {
            const list = document.getElementById('expense-list');
            list.innerHTML = snapshot.docs.map(doc => {
                const d = doc.data();
                return `<div style="margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:4px;">
                    [${d.cur}] ${d.amount} - ${d.note}<br>
                    <small>分攤: A ${d.a}% / B ${d.b}%</small>
                </div>`;
            }).join('');
        });

        initTravelLogic();
    </script>
</body>
</html>
