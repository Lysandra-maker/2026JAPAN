<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>靜如與怡伸的初夏紀行</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #FFFDF9;
            --paper-texture: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAMAAAAp4eJFAAAAVFBMVEWxtrX////f39/v7+/Pz8/f39/v7+/f39/v7+/v7+/f39/f39/f39/v7+/f39/f39/v7+/f39/f39/v7+/f39/f39/v7+/f39/f39/v7+/f39/f39/f39/86z50AAAAEnRSTlMAAQIDBAUGBwgJCgsMDQ4QEb5fX/QAAAAzSURBVEjH7dKxCgAxCAPA0fT/f7thidR4uM5gI6O4G+K0Y0/7R69v4E76Rre+4E765mXfH13tAM8Z+3FMAAAAAElFTkSuQmCC');
            --wc-primary: #8ABCA6; --wc-secondary: #ADC6D9; --wc-accent: #E5C384; --wc-peach: #F6D6C7;
            --text-dark: #3A4A41; --text-light: #7A8E81;
            --tag-spot: rgba(138, 188, 166, 0.7); --tag-food: rgba(222, 158, 125, 0.7);
            --tag-trans: rgba(143, 183, 194, 0.7); --tag-hotel: rgba(201, 169, 201, 0.7);
        }

        body { background-color: var(--bg-paper); background-image: var(--paper-texture); color: var(--text-dark); font-family: 'Noto Sans TC', sans-serif; margin: 0; padding: 0 0 110px 0; overflow-x: hidden; }
        h1, h2, h3, .serif { font-family: 'Noto Serif TC', serif; font-weight: 600; }
        
        .hero { padding: 40px 20px; text-align: center; position: relative; }
        .hero::before { content: ''; position: absolute; top: -30px; left: -10px; right: -10px; height: 180px; background: radial-gradient(circle at 30% 20%, var(--wc-secondary) 0%, rgba(255,255,255,0) 60%), radial-gradient(circle at 70% 30%, var(--wc-peach) 0%, rgba(255,255,255,0) 60%); opacity: 0.4; filter: blur(15px); z-index: -1; }
        .hero-title { font-size: 2.2rem; color: var(--text-dark); font-weight: 900; margin: 0; letter-spacing: 3px; position: relative; display: inline-block; }
        .hero-title::after { content: ''; position: absolute; bottom: -8px; left: 5%; width: 90%; height: 6px; background: var(--wc-accent); border-radius: 30px 10px; opacity: 0.6; }
        .countdown { display: inline-block; margin-top: 15px; padding: 8px 18px; background: white; border-radius: 20px 5px; border: 2px solid #FDF5E6; font-size: 0.85rem; color: var(--text-dark); box-shadow: 2px 2px 0 #F0E6D2; }

        .container { padding: 0 15px; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .date-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 5px 0 15px; margin-bottom: 10px; scrollbar-width: none; }
        .date-scroll::-webkit-scrollbar { display: none; }
        .date-card { min-width: 55px; text-align: center; padding: 10px 5px; border-radius: 12px 12px 12px 5px; background: rgba(255,255,255,0.7); border: 2px solid white; box-shadow: 2px 2px 6px rgba(0,0,0,0.02); cursor: pointer; }
        .date-card.active { background: var(--wc-primary); color: white; box-shadow: 3px 3px 10px rgba(138, 188, 166, 0.3); }
        .date-card .date { font-size: 1.1rem; font-weight: 700; }

        .section-card { background: rgba(255,255,255,0.8); border-radius: 15px 5px 15px 5px; padding: 20px; margin-bottom: 20px; border: 1px solid white; box-shadow: 2px 2px 10px rgba(0,0,0,0.02); }
        .section-title { font-size: 1.1rem; margin: 0 0 15px 0; border-left: 4px solid var(--wc-accent); padding-left: 10px; }

        .timeline { position: relative; padding-left: 20px; border-left: 3px solid rgba(226, 226, 226, 0.6); margin-left: 10px; }
        .time-item { position: relative; margin-bottom: 25px; background: white; padding: 15px; border-radius: 12px; border: 1px solid #FAF7F0; box-shadow: 2px 2px 5px rgba(0,0,0,0.01); }
        .time-item::before { content: ''; position: absolute; left: -30px; top: 15px; width: 14px; height: 14px; border-radius: 50%; background: var(--wc-primary); border: 3px solid var(--bg-paper); }
        .delete-btn { position: absolute; right: 10px; top: 10px; font-size: 0.8rem; color: #CCC; cursor: pointer; padding: 5px; }

        .boarding-pass { background: white; border-radius: 16px; margin-bottom: 25px; border: 2px solid rgba(173, 198, 217, 0.1); overflow: hidden; }
        .bp-header { background: var(--wc-secondary); color: white; padding: 10px 20px; font-size: 0.85rem; display: flex; justify-content: space-between; }
        .bp-body { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #EEE; }
        .bp-footer { padding: 12px 20px; background: #FBFCFD; display: flex; justify-content: space-between; font-size: 0.8rem; }
        .drive-btn { display: block; width: 100%; text-align: center; padding: 12px 0; background: #F0F4F7; color: var(--wc-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 700; }

        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #FDF5E6; border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; }
        .btn-add { background: var(--wc-primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 2px 2px 0 #6C9E86; }
        
        .quick-split-btns { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-mini { flex: 1; padding: 8px 5px; font-size: 0.75rem; background: white; border: 1px solid var(--wc-accent); border-radius: 8px; color: var(--text-dark); cursor: pointer; transition: 0.2s; }
        .btn-mini:active { background: var(--wc-accent); color: white; }

        .bottom-nav { position: fixed; bottom: 15px; left: 3%; width: 94%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); z-index: 2000; border: 1px solid white; }
        .nav-item { font-size: 0.65rem; color: var(--text-light); text-align: center; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .nav-item.active { color: var(--wc-primary); font-weight: 700; transform: scale(1.05); }
        .nav-icon { font-size: 1.2rem; }

        .todo-item { display: flex; align-items: center; margin-bottom: 12px; font-size: 0.9rem; }
        .done { text-decoration: line-through; color: #AAA; }
    </style>
</head>
<body>

    <div class="hero">
        <h1 class="hero-title">初夏紀行</h1>
        <div class="countdown" id="countdown-timer">載入中...</div>
    </div>

    <div class="container">
        <div id="page-schedule" class="page active">
            <div class="date-scroll" id="date-bar"></div>
            <div id="current-day-label" style="font-family: serif; font-size: 1.1rem; color: var(--wc-primary); margin-bottom: 15px; font-weight: 900; text-align: center;"></div>
            <div class="timeline" id="itinerary-list"></div>
            <div class="section-card" style="margin-top: 30px;">
                <h3 class="section-title">新增行程</h3>
                <input type="text" id="sched-time" placeholder="時間 (如 09:30)">
                <input type="text" id="sched-title" placeholder="地點/活動">
                <button class="btn-add" onclick="addSchedule()">加入今日手帳</button>
            </div>
        </div>

        <div id="page-bookings" class="page">
            <h2 class="serif">雲端憑證庫</h2>
            <div class="boarding-pass">
                <div class="bp-header"><span>5/29 去程</span><span>AirAsia D7 378</span></div>
                <div class="bp-body">
                    <div><b>TPE</b><div style="font-size: 0.7rem;">台北 15:40</div></div>
                    <div style="font-size: 1.2rem; opacity: 0.3;">✈️</div>
                    <div><b>KIX</b><div style="font-size: 0.7rem;">大阪 19:30</div></div>
                </div>
                <a href="#" class="drive-btn">📂 開啟電子機票</a>
            </div>
            <div class="section-card">
                <h3 class="section-title">樂天 STAY URBAN</h3>
                <div style="font-size: 0.85rem;">5/29 - 6/04 京都</div>
                <a href="#" class="drive-btn" style="margin-top:10px; border-radius:8px;">📂 訂房憑證</a>
            </div>
        </div>

        <div id="page-expense" class="page">
            <h2 class="serif">旅行帳本</h2>
            <div class="section-card" style="background: var(--text-dark); color: white;">
                <div style="font-size: 0.8rem; opacity: 0.8;">總計支出</div>
                <div id="total-val" style="font-size: 2rem; font-family: serif; font-weight: 900;">¥ 0</div>
            </div>
            <div class="section-card">
                <h3 class="section-title">記入支出</h3>
                <input type="number" id="exp-amt" placeholder="日圓金額 ¥">
                <div class="quick-split-btns">
                    <button class="btn-mini" onclick="quickSplit('half')">1/2 平分</button>
                    <button class="btn-mini" onclick="quickSplit('j100')">靜如 100%</button>
                    <button class="btn-mini" onclick="quickSplit('y100')">怡伸 100%</button>
                </div>
                <input type="text" id="exp-item" placeholder="項目說明">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="exp-j" placeholder="靜如負擔">
                    <input type="number" id="exp-y" placeholder="怡伸負擔">
                </div>
                <button class="btn-add" onclick="saveExpense()">儲存紀錄</button>
            </div>
            <div id="exp-list"></div>
        </div>

        <div id="page-planning" class="page">
            <h2 class="serif">行前準備</h2>
            <div class="section-card">
                <div id="todo-list"></div>
                <input type="text" id="todo-input" placeholder="新增待辦事項..."><button class="btn-add" onclick="addTodo()">加入清單</button>
            </div>
        </div>

        <div id="page-shopping" class="page">
            <h2 class="serif">購物願望清單</h2>
            <div class="section-card">
                <div id="shop-list"></div>
                <input type="text" id="shop-input" placeholder="想買什麼呢？"><button class="btn-add" style="background: var(--wc-peach); box-shadow: 2px 2px 0 #D9B3A0;" onclick="addShop()">加入願望</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('schedule')"><span class="nav-icon">🗺️</span><span>行程</span></div>
        <div class="nav-item" onclick="switchTab('bookings')"><span class="nav-icon">🎟️</span><span>憑證</span></div>
        <div class="nav-item" onclick="switchTab('expense')"><span class="nav-icon">🖋️</span><span>帳本</span></div>
        <div class="nav-item" onclick="switchTab('planning')"><span class="nav-icon">🎒</span><span>準備</span></div>
        <div class="nav-item" onclick="switchTab('shopping')"><span class="nav-icon">🛍️</span><span>購物</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, where, serverTimestamp, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzC3lUnUG7EyhKkcA096FywJ6A66Pnah4",
            authDomain: "japan-e9eba.firebaseapp.com",
            projectId: "japan-e9eba",
            storageBucket: "japan-e9eba.firebasestorage.app",
            messagingSenderId: "400670967338",
            appId: "1:400670967338:web:bd11f6196d1aeaeb78a553"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let selectedDate = "5/29";

        // 綁定全局函數給 HTML 點擊
        window.addSchedule = async () => {
            const time = document.getElementById('sched-time').value;
            const title = document.getElementById('sched-title').value;
            if(!time || !title) return;
            await addDoc(collection(db, "schedules"), { date: selectedDate, time, title, createdAt: serverTimestamp() });
            document.getElementById('sched-time').value = ""; document.getElementById('sched-title').value = "";
        };

        window.loadSchedule = (date) => {
            selectedDate = date;
            document.getElementById('current-day-label').innerText = `2026. ${date} 行程手帳`;
            const qS = query(collection(db, "schedules"), where("date", "==", date), orderBy("time"));
            onSnapshot(qS, (snap) => {
                let html = "";
                snap.forEach(d => { html += `<div class="time-item"><div class="delete-btn" onclick="deleteItem('schedules','${d.id}')">✕</div><b>${d.data().time}</b> ${d.data().title}</div>`; });
                document.getElementById('itinerary-list').innerHTML = html || "<p style='color:#AAA; text-align:center;'>尚未填寫行程</p>";
            });
        };

        window.quickSplit = (mode) => {
            const amt = Number(document.getElementById('exp-amt').value);
            if(!amt) return;
            if(mode==='half'){ document.getElementById('exp-j').value = amt/2; document.getElementById('exp-y').value = amt/2; }
            else if(mode==='j100'){ document.getElementById('exp-j').value = amt; document.getElementById('exp-y').value = 0; }
            else if(mode==='y100'){ document.getElementById('exp-j').value = 0; document.getElementById('exp-y').value = amt; }
        };

        window.saveExpense = async () => {
            const amt = document.getElementById('exp-amt').value;
            const item = document.getElementById('exp-item').value;
            if(!amt || !item) return;
            await addDoc(collection(db, "expenses"), { amount: Number(amt), item, jingru: Number(document.getElementById('exp-j').value||0), yishen: Number(document.getElementById('exp-y').value||0), createdAt: serverTimestamp() });
            document.getElementById('exp-amt').value = ""; document.getElementById('exp-item').value = "";
        };

        onSnapshot(query(collection(db, "expenses"), orderBy("createdAt", "desc")), (snap) => {
            let total = 0; let html = "";
            snap.forEach(d => { const e = d.data(); total += e.amount; html += `<div class="section-card" style="padding:10px; margin-bottom:8px; display:flex; justify-content:space-between;"><div><b>${e.item}</b><br><small>靜 ¥${e.jingru} | 怡 ¥${e.yishen}</small></div><div style="font-weight:900; color:var(--wc-primary);">¥${e.amount}</div></div>`; });
            document.getElementById('total-val').innerText = `¥ ${total.toLocaleString()}`;
            document.getElementById('exp-list').innerHTML = html;
        });

        window.addTodo = () => addListDoc("todos", "todo-input");
        window.addShop = () => addListDoc("shopping", "shop-input");
        async function addListDoc(colName, inputId){
            const val = document.getElementById(inputId).value; if(!val) return;
            await addDoc(collection(db, colName), { task: val, done: false, createdAt: serverTimestamp() });
            document.getElementById(inputId).value = "";
        }

        window.toggleDone = async (col, id, status) => { await updateDoc(doc(db, col, id), { done: !status }); };
        window.deleteItem = async (col, id) => { if(confirm("確定刪除？")) await deleteDoc(doc(db, col, id)); };

        const syncList = (col, elId) => {
            onSnapshot(query(collection(db, col), orderBy("createdAt")), (snap) => {
                let html = "";
                snap.forEach(d => { const t = d.data(); html += `<div class="todo-item"><input type="checkbox" ${t.done?'checked':''} onclick="toggleDone('${col}','${d.id}',${t.done})"><span class="${t.done?'done':''}">${t.task}</span><div style="margin-left:auto; color:#CCC;" onclick="deleteItem('${col}','${d.id}')">✕</div></div>`; });
                document.getElementById(elId).innerHTML = html;
            });
        };
        syncList("todos", "todo-list"); syncList("shopping", "shop-list");

        const tripDates = ["5/29","5/30","5/31","6/01","6/02","6/03","6/04","6/05","6/06","6/07","6/08"];
        const dateBar = document.getElementById('date-bar');
        tripDates.forEach(d => {
            const card = document.createElement('div'); card.className = `date-card ${d==="5/29"?'active':''}`; card.innerHTML = `<div class="date">${d}</div>`;
            card.onclick = () => { document.querySelectorAll('.date-card').forEach(c => c.classList.remove('active')); card.classList.add('active'); loadSchedule(d); };
            dateBar.appendChild(card);
        });
        loadSchedule("5/29");
    </script>

    <script>
        function calculateCountdown() {
            const diff = new Date('2026-05-29') - new Date();
            const el = document.getElementById('countdown-timer');
            if(diff<=0) el.innerText = "旅程進行中！";
            else el.innerHTML = `距離啟程 <b>${Math.ceil(diff/(1000*60*60*24))}</b> 天`;
        }
        window.switchTab = function(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const activeNav = Array.from(document.querySelectorAll('.nav-item')).find(n => n.getAttribute('onclick').includes(id));
            if(activeNav) activeNav.classList.add('active');
            window.scrollTo(0,0);
        };
        calculateCountdown();
    </script>
</body>
</html>
